# =============================================================================
# ASHOS reverse proxy.
#
# TLS is terminated here. Certificates are mounted at /etc/nginx/certs; for a
# pilot use certbot or a self-signed pair. HTTP exists only to redirect and to
# answer the ACME challenge.
# =============================================================================

upstream ashos_app {
    server web:8000;
    keepalive 32;
}

# Guest-facing endpoints get their own limit: a kiosk in a lobby is an open
# terminal, and AI calls cost money per request (goal.txt R3).
limit_req_zone $binary_remote_addr zone=ashos_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ashos_ai:10m rate=3r/s;

server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Passport scans and room galleries; 25 MB matches DATA_UPLOAD_MAX_MEMORY_SIZE.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        # Guest documents live here. Never list a directory.
        autoindex off;
    }

    # WebSocket: voice and live chat. The long read timeout is deliberate — a
    # guest pausing mid-sentence must not drop the session.
    location /ws/ {
        proxy_pass http://ashos_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/v1/(reception|ai|vision)/ {
        limit_req zone=ashos_ai burst=10 nodelay;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_pass http://ashos_app;
        # Streaming responses must not be buffered or the first token arrives late.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location /api/ {
        limit_req zone=ashos_api burst=50 nodelay;
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_pass http://ashos_app;
    }

    location / {
        include /etc/nginx/conf.d/proxy_common.inc;
        proxy_pass http://ashos_app;
    }
}
