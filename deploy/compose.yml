# =============================================================================
# ASHOS local / pilot stack.
#
#   docker compose -f deploy/compose.yml --env-file .env up -d --build
#
# Ports are bound to 127.0.0.1 so a laptop on hotel wifi does not accidentally
# expose Postgres or MinIO to the LAN.
# =============================================================================

name: ashos

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ashos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ashos}
      POSTGRES_USER: ${POSTGRES_USER:-ashos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ashos}
      # C collation keeps index behaviour identical across host locales.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ashos} -d ${POSTGRES_DB:-ashos}"]
      interval: 10s
      timeout: 5s
      retries: 10
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=32MB
      # HNSW index builds are memory-bound; the default 64MB makes them crawl.
      - -c
      - maintenance_work_mem=512MB
      - -c
      - max_parallel_maintenance_workers=2

  redis:
    image: redis:7-alpine
    container_name: ashos-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      # Host port is configurable: developer machines often already run a Redis.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ashos-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-ashosminio}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-ashosminio}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-ashosminio} ${AWS_SECRET_ACCESS_KEY:-ashosminio};
      mc mb --ignore-existing local/${AWS_STORAGE_BUCKET_NAME:-ashos-media};
      mc anonymous set none local/${AWS_STORAGE_BUCKET_NAME:-ashos-media};
      echo 'bucket ready';
      "

  web:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        EXTRAS: ${IMAGE_EXTRAS:-base}
    container_name: ashos-web
    restart: unless-stopped
    command: ["web"]
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgres://${POSTGRES_USER:-ashos}:${POSTGRES_PASSWORD:-ashos}@postgres:5432/${POSTGRES_DB:-ashos}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CHANNELS_REDIS_URL: redis://redis:6379/3
      AWS_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - media:/app/media
      - static:/app/staticfiles
      - aimodels:/app/ai_models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        EXTRAS: ${IMAGE_EXTRAS:-base}
    container_name: ashos-worker
    restart: unless-stopped
    command: ["worker"]
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgres://${POSTGRES_USER:-ashos}:${POSTGRES_PASSWORD:-ashos}@postgres:5432/${POSTGRES_DB:-ashos}
      CELERY_BROKER_URL: redis://redis:6379/1
      AWS_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - media:/app/media
      - aimodels:/app/ai_models
    depends_on:
      - web

  beat:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        EXTRAS: ${IMAGE_EXTRAS:-base}
    container_name: ashos-beat
    restart: unless-stopped
    command: ["beat"]
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgres://${POSTGRES_USER:-ashos}:${POSTGRES_PASSWORD:-ashos}@postgres:5432/${POSTGRES_DB:-ashos}
      CELERY_BROKER_URL: redis://redis:6379/1
      RUN_MIGRATIONS: "false"
    depends_on:
      - web

  nginx:
    image: nginx:1.27-alpine
    container_name: ashos-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/ashos.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/proxy_common.inc:/etc/nginx/conf.d/proxy_common.inc:ro
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

volumes:
  pgdata:
  redisdata:
  miniodata:
  media:
  static:
  aimodels:
